# assistant.conf — every tunable for the local voice assistant.
#
# Sourced by ~/bin/assistant. Keep it valid bash: no spaces around '=', quote
# anything with spaces.

# ---- LLM (Ollama, local) -------------------------------------------------
# The one variable to change to swap models.
ASSISTANT_MODEL="llama3.2:3b"

# ---- STT (whisper.cpp, local) --------------------------------------------
# base.en is ~75 MB and safe on 8 GB RAM. small.en is more accurate but needs
# more headroom. Values: base.en | small.en
ASSISTANT_WHISPER_MODEL="base.en"

# ---- TTS (Piper, local) --------------------------------------------------
# en_US-lessac-medium is the default. See README for the full voice list.
ASSISTANT_PIPER_VOICE="en_US-lessac-medium"

# ---- Wake word (openWakeWord) --------------------------------------------
# Any model openWakeWord ships with. Common: "hey jarvis", "hey computer",
# "ok google", "hey google", "terminator".
ASSISTANT_WAKE_WORD="hey jarvis"

# Always-on wake-word mode. Set to "0" to disable the daemon entirely.
ASSISTANT_WAKE_WORD_ENABLED="1"

# ---- Recording -----------------------------------------------------------
# Stop after this many seconds of trailing silence.
ASSISTANT_SILENCE_TIMEOUT="1.2"
# Trailing-silence threshold in dB (lower = stops later on noisy rooms).
ASSISTANT_SILENCE_DB="-35"
# Hard cap on a single recording, so a loud room can't record forever.
ASSISTANT_RECORD_CAP="30"
# Push-to-talk cap (listen subcommand) — shorter than the wake path.
ASSISTANT_LISTEN_CAP="20"

# ---- Paths ---------------------------------------------------------------
ASSISTANT_BIN_DIR="${HOME}/bin"
ASSISTANT_ETC_DIR="${HOME}/.config/assistant"
ASSISTANT_STATE_DIR="${HOME}/.local/state/assistant"
ASSISTANT_LOG_FILE="${ASSISTANT_STATE_DIR}/assistant.log"
ASSISTANT_BAR_STATE="${ASSISTANT_STATE_DIR}/state"
ASSISTANT_VOICE_DIR="${HOME}/.local/share/assistant/voices"
ASSISTANT_MODEL_DIR="${HOME}/.local/share/assistant/whisper"
ASSISTANT_VENV_DIR="${HOME}/.venv/oww"
ASSISTANT_WAKEWORD_PY="${HOME}/assistant/wakeword.py"
ASSISTANT_WAKEWORD_TRIGGER="${ASSISTANT_STATE_DIR}/wake"

# ---- Misc ----------------------------------------------------------------
# Notification timeout in ms.
ASSISTANT_NOTIFY_TIMEOUT="8000"
# LLM timeout in seconds. CPU inference on a 3B model takes seconds per token;
# 300 s leaves headroom for a slow machine without looking hung forever.
ASSISTANT_LLM_TIMEOUT="300"
# Hard cap on reply length, in tokens. Measured on this box (Intel iGPU, CPU
# only, ~0.8 s/token): 32 tokens ~= 25 s, 96 tokens ~= 58 s clean and much
# worse under load. A spoken answer needs far less than 96 tokens, so keep
# this low — it is the single biggest latency lever.
ASSISTANT_LLM_NUM_PREDICT="32"
# STT timeout in seconds.
ASSISTANT_STT_TIMEOUT="60"
# TTS timeout in seconds.
ASSISTANT_TTS_TIMEOUT="30"
